<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>OT Calendar Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F4F0; --surface: #FFFFFF; --green: #1A5C38; --green-light: #E8F2ED;
    --red: #C0392B; --red-light: #FDECEA; --charcoal: #2C2C2C; --slate: #6B7280;
    --border: #E2E1DC; --shadow: 0 2px 12px rgba(0,0,0,0.08); --shadow-lg: 0 8px 32px rgba(0,0,0,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--charcoal); min-height: 100vh; width: 100%; margin: 0; }
  #pin-screen { position: fixed; inset: 0; z-index: 1000; background: var(--green); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
  .pin-logo { text-align: center; color: white; }
  .pin-title { font-size: 22px; font-weight: 700; }
  .pin-sub { font-size: 13px; opacity: 0.7; font-family: 'DM Mono', monospace; margin-top: 4px; }
  .pin-dots { display: flex; gap: 14px; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); transition: background 0.15s; }
  .pin-dot.filled { background: white; border-color: white; }
  .pin-keypad { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; width: 240px; }
  .pin-btn { background: rgba(255,255,255,0.1); border: none; color: white; font-size: 22px; font-family: 'DM Mono', monospace; font-weight: 500; border-radius: 12px; padding: 18px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .pin-btn:active { background: rgba(255,255,255,0.25); }
  .pin-error { color: #FF6B6B; font-size: 13px; height: 18px; font-family: 'DM Mono', monospace; }
  #app { display: none; flex-direction: column; min-height: 100vh; }
  .app-header { background: var(--green); padding: 16px 24px 12px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .header-title { color: white; font-size: 18px; font-weight: 700; }
  .header-sub { color: rgba(255,255,255,0.65); font-size: 11px; font-family: 'DM Mono', monospace; margin-top: 2px; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4,1fr); padding-bottom: env(safe-area-inset-bottom); z-index: 200; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px; background: none; border: none; cursor: pointer; color: var(--slate); font-size: 10px; font-family: 'DM Sans', sans-serif; font-weight: 500; transition: color 0.15s; -webkit-tap-highlight-color: transparent; }
  .nav-btn.active { color: var(--green); }
  .nav-btn svg { width: 22px; height: 22px; }
  .main-content { flex: 1; padding: 16px 24px 90px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
  .view { display: none; }
  .view.active { display: block; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .month-nav-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; color: var(--green); -webkit-tap-highlight-color: transparent; }
  .month-label { font-size: 18px; font-weight: 700; color: var(--charcoal); font-family: 'DM Mono', monospace; }
  .cal-grid { background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .cal-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media(min-width: 900px) {
    .cal-layout { grid-template-columns: minmax(0,1fr) 360px; align-items: start; }
    .cal-sidebar { position: sticky; top: 80px; }
    .summary-grid { grid-template-columns: repeat(4,1fr); }
    .month-stats { grid-template-columns: repeat(3,1fr); }
    .worker-bar-list { gap: 10px; }
  }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7,1fr); background: var(--green); }
  .cal-wd { text-align: center; padding: 8px 2px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.75); font-family: 'DM Mono', monospace; }
  .cal-days { display: grid; grid-template-columns: repeat(7,1fr); gap: 1px; background: var(--border); }
  .cal-day { background: var(--surface); min-height: 58px; padding: 6px 4px 4px; cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; -webkit-tap-highlight-color: transparent; transition: background 0.1s; }
  .cal-day:active { background: var(--green-light); }
  .cal-day.empty { background: #F9F8F5; cursor: default; }
  .cal-day.today .day-num { background: var(--green); color: white; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .cal-day.weekend .day-num { color: var(--red); }
  .cal-day.has-ot { background: #FFF5F5; }
  .cal-day.selected { background: var(--green-light); }
  .day-num { font-size: 13px; font-weight: 600; color: var(--charcoal); font-family: 'DM Mono', monospace; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; }
  .day-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; margin-top: 2px; }
  .day-dot { width: 5px; height: 5px; border-radius: 50%; }
  .day-dot.ot { background: var(--red); }
  .day-dot.reg { background: var(--green); }
  .day-entry-count { font-size: 9px; color: var(--slate); font-family: 'DM Mono', monospace; margin-top: 1px; }
  .month-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 14px 0; }
  .stat-card { background: var(--surface); border-radius: 12px; padding: 12px 10px; text-align: center; box-shadow: var(--shadow); }
  .stat-val { font-size: 22px; font-weight: 700; font-family: 'DM Mono', monospace; }
  .stat-val.ot { color: var(--red); }
  .stat-val.reg { color: var(--green); }
  .stat-val.days { color: var(--charcoal); }
  .stat-lbl { font-size: 10px; color: var(--slate); font-weight: 500; margin-top: 2px; }
  .day-panel-overlay { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.4); display: none; align-items: flex-end; }
  .day-panel-overlay.open { display: flex; }
  .day-panel { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-height: 85vh; overflow-y: auto; padding: 0 0 40px; animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .day-panel-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
  .day-panel-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .day-panel-date { font-size: 18px; font-weight: 700; }
  .day-panel-close { background: var(--border); border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .day-entries { padding: 12px 16px; }
  .entry-card { background: var(--bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; border-left: 3px solid var(--green); }
  .entry-card.ot-entry { border-left-color: var(--red); background: var(--red-light); }
  .entry-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .entry-worker { font-weight: 700; font-size: 14px; }
  .entry-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; font-family: 'DM Mono', monospace; }
  .badge-ot { background: var(--red); color: white; }
  .badge-reg { background: var(--green); color: white; }
  .entry-meta { font-size: 12px; color: var(--slate); margin-bottom: 4px; }
  .entry-notes { font-size: 13px; color: var(--charcoal); line-height: 1.4; }
  .entry-hours { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--slate); margin-top: 4px; }
  .entry-actions { display: flex; gap: 8px; margin-top: 8px; }
  .entry-del-btn { background: none; border: 1px solid #ddd; border-radius: 8px; padding: 4px 10px; font-size: 11px; cursor: pointer; color: var(--red); }
  .entry-edit-btn { background: none; border: 1px solid #ddd; border-radius: 8px; padding: 4px 10px; font-size: 11px; cursor: pointer; color: var(--green); }
  .day-empty-state { text-align: center; padding: 32px 20px; color: var(--slate); font-size: 14px; }
  .add-entry-btn { margin: 0 16px; background: var(--green); color: white; border: none; border-radius: 12px; padding: 14px; width: calc(100% - 32px); font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .day-justify-btn { margin: 10px 16px 0; background: var(--red-light); color: var(--red); border: 1px solid var(--red); border-radius: 12px; padding: 12px; width: calc(100% - 32px); font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .modal-overlay { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,0.5); display: none; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal-sheet { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px 20px 60px; animation: slideUp 0.2s ease; }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 600; color: var(--slate); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input, .form-select, .form-textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 15px; font-family: 'DM Sans', sans-serif; color: var(--charcoal); appearance: none; -webkit-appearance: none; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline: 2px solid var(--green); border-color: transparent; }
  .form-textarea { min-height: 80px; resize: vertical; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .type-btn { padding: 10px; border-radius: 10px; border: 2px solid var(--border); font-size: 14px; font-weight: 600; cursor: pointer; background: var(--bg); transition: all 0.15s; font-family: 'DM Sans', sans-serif; }
  .type-btn.sel-reg { background: var(--green-light); border-color: var(--green); color: var(--green); }
  .type-btn.sel-ot { background: var(--red-light); border-color: var(--red); color: var(--red); }
  .form-submit { width: 100%; background: var(--green); color: white; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 8px; }
  .form-cancel { width: 100%; background: none; color: var(--slate); border: none; padding: 12px; font-size: 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--slate); text-transform: uppercase; letter-spacing: 0.8px; margin: 20px 0 10px; }
  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; color: var(--slate); transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
  .filter-chip.active { background: var(--green); border-color: var(--green); color: white; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .summary-big-card { background: var(--surface); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
  .summary-big-card.full { grid-column: span 2; }
  .sbc-label { font-size: 11px; color: var(--slate); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .sbc-val { font-size: 28px; font-weight: 700; font-family: 'DM Mono', monospace; margin: 4px 0 2px; }
  .sbc-val.red { color: var(--red); }
  .sbc-val.green { color: var(--green); }
  .sbc-sub { font-size: 11px; color: var(--slate); }
  .worker-bar-list { display: flex; flex-direction: column; gap: 8px; }
  .worker-bar-row { display: flex; align-items: center; gap: 10px; }
  .worker-bar-name { font-size: 12px; font-weight: 600; width: 70px; flex-shrink: 0; }
  .worker-bar-track { flex: 1; background: var(--border); border-radius: 4px; height: 8px; }
  .worker-bar-fill { height: 8px; border-radius: 4px; background: var(--green); }
  .worker-bar-fill.ot { background: var(--red); }
  .worker-bar-num { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--slate); width: 32px; text-align: right; }
  .location-tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .loc-tag { background: var(--green-light); color: var(--green); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
  .loc-tag.ot { background: var(--red-light); color: var(--red); }
  .report-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .report-select-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gen-report-btn { background: var(--green); color: white; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .report-output { background: var(--surface); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); font-size: 13px; line-height: 1.7; color: var(--charcoal); }
  .report-output h2 { font-size: 16px; margin-bottom: 4px; color: var(--green); }
  .report-output h3 { font-size: 13px; font-weight: 700; margin: 14px 0 4px; color: var(--charcoal); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .report-output .ot-event { background: var(--red-light); border-radius: 8px; padding: 10px 12px; margin: 8px 0; border-left: 3px solid var(--red); }
  .report-meta { font-size: 11px; color: var(--slate); margin-bottom: 12px; font-family: 'DM Mono', monospace; }
  .copy-report-btn { width: 100%; margin-top: 12px; background: var(--charcoal); color: white; border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--charcoal); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .export-fab { position: fixed; bottom: 76px; right: 16px; z-index: 250; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .export-fab-btn { background: var(--green); color: white; border: none; border-radius: 50px; padding: 12px 18px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.2); white-space: nowrap; font-family: "DM Sans", sans-serif; -webkit-tap-highlight-color: transparent; }
  .export-menu { display: none; flex-direction: column; gap: 8px; align-items: flex-end; }
  .export-menu-item { background: var(--surface); color: var(--charcoal); border: 1px solid var(--border); border-radius: 50px; padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap; font-family: "DM Sans", sans-serif; }
  .toast.show { opacity: 1; }
  .search-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; width: 100%; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--charcoal); margin-bottom: 12px; }
  .search-bar:focus { outline: 2px solid var(--green); }
  .list-entry-card { background: var(--surface); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--green); box-shadow: var(--shadow); }
  .list-entry-card.ot { border-left-color: var(--red); }
  .list-entry-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .list-entry-date { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--slate); }
  .list-entry-worker { font-size: 14px; font-weight: 700; }
  .list-entry-loc { font-size: 12px; color: var(--slate); }
  .list-entry-notes { font-size: 12px; color: var(--charcoal); margin-top: 4px; line-height: 1.4; }
  .select-wrap { position: relative; }
  .select-wrap::after { content: '▾'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--slate); }
</style>
</head>
<body>
<div id="pin-screen">
  <div class="pin-logo">
    <div class="pin-title">OT Calendar</div>
    <div class="pin-sub">San Mateo County Facilities</div>
  </div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-keypad" id="keypad"></div>
  <div class="pin-error" id="pin-error"></div>
</div>

<div id="app">
  <div class="app-header">
    <div class="header-top">
      <div><div class="header-title">OT Calendar</div><div class="header-sub">San Mateo County Facilities</div></div>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </div>
  </div>
  <div class="main-content">
    <div class="view active" id="view-calendar">
      <div class="month-nav">
        <button class="month-nav-btn" onclick="changeMonth(-1)">‹</button>
        <div class="month-label" id="month-label"></div>
        <button class="month-nav-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="month-stats" id="month-stats"></div>
      <div class="cal-layout">
        <div>
          <div class="cal-grid">
            <div class="cal-weekdays"><div class="cal-wd">Su</div><div class="cal-wd">Mo</div><div class="cal-wd">Tu</div><div class="cal-wd">We</div><div class="cal-wd">Th</div><div class="cal-wd">Fr</div><div class="cal-wd">Sa</div></div>
            <div class="cal-days" id="cal-days"></div>
          </div>
        </div>
        <div class="cal-sidebar" id="cal-sidebar" style="display:none">
          <div style="background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;">
            <div style="background:var(--green);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;">
              <div style="color:white;font-weight:700;font-size:15px" id="sidebar-date">Select a day</div>
              <button onclick="closeSidebar()" style="background:rgba(255,255,255,0.2);border:none;color:white;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px">✕</button>
            </div>
            <div id="sidebar-entries" style="padding:12px 14px;max-height:60vh;overflow-y:auto"></div>
            <div style="padding:0 14px 14px">
              <button class="add-entry-btn" id="sidebar-add-btn">+ Add Entry</button>
              <button class="day-justify-btn" id="sidebar-justify-btn" style="display:none;margin-top:8px">📋 Day Justification</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="view" id="view-summary">
      <div class="section-title">Period</div><div class="filter-row" id="period-filters"></div>
      <div class="section-title">Worker</div><div class="filter-row" id="worker-filters"></div>
      <div class="section-title">Location</div><div class="filter-row" id="location-filters"></div>
      <div id="summary-content"></div>
    </div>
    <div class="view" id="view-entries">
      <input class="search-bar" type="text" id="search-input" placeholder="Search worker, location, notes…" oninput="renderList()">
      <div class="filter-row" id="list-type-filters"></div>
      <div id="entries-list"></div>
    </div>
    <div class="view" id="view-report">
      <div class="section-title">Generate OT Justification</div>
      <div class="report-controls">
        <div class="report-select-row">
          <div class="select-wrap"><select class="form-select" id="report-month"><option value="all">All Months</option></select></div>
          <div class="select-wrap"><select class="form-select" id="report-type"><option value="all">All Types</option><option value="OT">OT Only</option><option value="REG">Regular Only</option></select></div>
        </div>
        <button class="gen-report-btn" onclick="generateReport()">Generate Justification Report</button>
      </div>
      <div id="report-output"></div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-calendar" onclick="switchView('calendar')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar
    </button>
    <button class="nav-btn" id="nav-summary" onclick="switchView('summary')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Summary

// ── PIN SETUP ──
let pinEntry='';
const keypadEl=document.getElementById('keypad');
[1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(k=>{
  const btn=document.createElement('button');
  btn.className='pin-btn';
  btn.textContent=k;
  if(k==='') { btn.style.visibility='hidden'; }
  btn.onclick=()=>{
    if(k==='⌫') { pinEntry=pinEntry.slice(0,-1); }
    else if(k!=='') { pinEntry+=String(k); }
    updateDots();
    if(pinEntry.length===4) checkPin();
  };
  keypadEl.appendChild(btn);
});
function updateDots(){
  for(let i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('filled', i<pinEntry.length);
}
function checkPin(){
  if(pinEntry===PIN){
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    initApp();
  } else {
    document.getElementById('pin-error').textContent='Incorrect PIN. Try again.';
    pinEntry=''; updateDots();
    setTimeout(()=>{ document.getElementById('pin-error').textContent=''; },1500);
  }
}

// ── MERGE SEED WITH LOCALSTORAGE ──
let storedEntries=JSON.parse(localStorage.getItem('otcal_entries')||'[]');
const storedIds=new Set(storedEntries.map(e=>e.id));
const merged=[...storedEntries,...SEED_DATA.filter(e=>!storedIds.has(e.id))];
let entries=merged;
let nextId=Math.max(parseInt(localStorage.getItem('otcal_nextid')||'2000'),...entries.map(e=>isNaN(parseInt(e.id))?0:parseInt(e.id)+1));
function save(){localStorage.setItem('otcal_entries',JSON.stringify(entries));localStorage.setItem('otcal_nextid',String(nextId));}

  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('nav-'+v).classList.add('active');
  if(v==='summary') renderSummary();
  if(v==='entries') renderList();
  if(v==='report') populateReportMonths();
}

function changeMonth(d){
  currentMonth+=d;
  if(currentMonth>11){currentMonth=0;currentYear++;}
  if(currentMonth<0){currentMonth=11;currentYear--;}
  renderCalendar();
}

function renderCalendar(){
  document.getElementById('month-label').textContent=MONTHS[currentMonth].substring(0,3).toUpperCase()+' '+currentYear;
  const firstDay=new Date(currentYear,currentMonth,1).getDay();
  const dim=new Date(currentYear,currentMonth+1,0).getDate();
  const today=new Date();
  const calDays=document.getElementById('cal-days');
  calDays.innerHTML='';
  const me=entries.filter(e=>{const d=new Date(e.date+'T12:00:00');return d.getFullYear()===currentYear&&d.getMonth()===currentMonth;});
  const otH=me.filter(e=>e.type==='OT').reduce((a,e)=>a+(parseFloat(e.otHours)||0),0);
  const rH=me.filter(e=>e.type==='REG').reduce((a,e)=>a+(parseFloat(e.regHours)||0),0);
  const otD=new Set(me.filter(e=>e.type==='OT').map(e=>e.date)).size;
  document.getElementById('month-stats').innerHTML=`
    <div class="stat-card"><div class="stat-val ot">${otH}</div><div class="stat-lbl">OT Hours</div></div>
    <div class="stat-card"><div class="stat-val reg">${rH}</div><div class="stat-lbl">Reg Hours</div></div>
    <div class="stat-card"><div class="stat-val days">${otD}</div><div class="stat-lbl">OT Days</div></div>`;
  for(let i=0;i<firstDay;i++){const c=document.createElement('div');c.className='cal-day empty';calDays.appendChild(c);}
  for(let d=1;d<=dim;d++){
    const ds=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const de=entries.filter(e=>e.date===ds);
    const hasOT=de.some(e=>e.type==='OT'),hasR=de.some(e=>e.type==='REG');
    const dow=new Date(currentYear,currentMonth,d).getDay();
    const isT=today.getFullYear()===currentYear&&today.getMonth()===currentMonth&&today.getDate()===d;
    const isW=dow===0||dow===6,isSel=selectedDate===ds;
    const cell=document.createElement('div');
    cell.className=`cal-day${hasOT?' has-ot':''}${isW?' weekend':''}${isT?' today':''}${isSel?' selected':''}`;
    cell.onclick=()=>openDayPanel(ds,d);
    let dots='';
    if(hasOT) dots+='<div class="day-dot ot"></div>';
    if(hasR) dots+='<div class="day-dot reg"></div>';
    cell.innerHTML=`<div class="day-num">${d}</div><div class="day-dots">${dots}</div>${de.length?`<div class="day-entry-count">${de.length}</div>`:''}`;
    calDays.appendChild(cell);
  }
}

function isDesktop(){ return window.innerWidth >= 900; }

function openDayPanel(ds,dn){
  selectedDate=ds;
  const dow=new Date(ds+'T12:00:00').getDay();
  const dateLabel=`${DS[dow]}, ${MONTHS[currentMonth]} ${dn}, ${currentYear}`;
  const hasOT=entries.some(e=>e.date===ds&&e.type==='OT');

    // Show sidebar panel
    document.getElementById('cal-sidebar').style.display='block';

    renderSidebarEntries(ds);
    document.getElementById('sidebar-add-btn').onclick=()=>openModal(ds);
    const jb=document.getElementById('sidebar-justify-btn');
    jb.style.display=hasOT?'block':'none';
    jb.onclick=()=>generateDayReport(ds);

function selectType(t){

function openModal(ds,editId=null){
  editingId=editId;
  document.getElementById('modal-title').textContent=editId?'Edit Entry':'Add Entry';
  if(editId){
    const e=entries.find(en=>en.id==editId);
    if(e){selectType(e.type);document.getElementById('f-worker').value=e.worker;document.getElementById('f-location').value=e.location;document.getElementById('f-reghours').value=e.regHours||'';document.getElementById('f-othours').value=e.otHours||'';document.getElementById('f-notes').value=e.notes||'';document.getElementById('f-reason').value=e.reason||'';}
  } else {
    selectType('REG');['f-worker','f-location','f-notes','f-reason'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-reghours').value='8';document.getElementById('f-othours').value='';

function saveEntry(){
  const worker=document.getElementById('f-worker').value,location=document.getElementById('f-location').value;
  if(!worker||!location){showToast('Select worker and location');return;}
  const entry={id:editingId||String(nextId++),date:selectedDate,type:entryType,worker,location,regHours:parseFloat(document.getElementById('f-reghours').value)||0,otHours:parseFloat(document.getElementById('f-othours').value)||0,notes:document.getElementById('f-notes').value.trim(),reason:document.getElementById('f-reason').value};
  if(editingId) entries=entries.map(e=>e.id==editingId?entry:e);
  else entries.push(entry);
  save();closeModal();
  if(isDesktop()) renderSidebarEntries(selectedDate);
  else { renderDayEntries(selectedDate); document.getElementById('day-justify-btn').style.display=entries.some(e=>e.date===selectedDate&&e.type==='OT')?'block':'none'; }
  const sjb=document.getElementById('sidebar-justify-btn');
  if(sjb) sjb.style.display=entries.some(e=>e.date===selectedDate&&e.type==='OT')?'block':'none';
  renderCalendar();
  showToast(editingId?'Entry updated':'Entry saved');editingId=null;
}

function deleteEntry(id,ds){
  if(!confirm('Delete this entry?'))return;
  entries=entries.filter(e=>e.id!=id);
  save();
  if(isDesktop()) renderSidebarEntries(ds);
  else renderDayEntries(ds);
  renderCalendar();
  showToast('Entry deleted');
}

  let wf=document.getElementById('worker-filters');
  wf.innerHTML=`<div class="filter-chip ${summaryWorkerFilter==='All'?'active':''}" onclick="setSummaryWorker('All')">All</div>`;
  WORKERS.forEach(w=>{if(entries.some(e=>e.worker===w))wf.innerHTML+=`<div class="filter-chip ${summaryWorkerFilter===w?'active':''}" onclick="setSummaryWorker('${w}')">${w}</div>`;});
  let lf=document.getElementById('location-filters');
  lf.innerHTML=`<div class="filter-chip ${summaryLocationFilter==='All'?'active':''}" onclick="setSummaryLocation('All')">All</div>`;
  LOCATIONS.forEach(l=>{if(entries.some(e=>e.location===l))lf.innerHTML+=`<div class="filter-chip ${summaryLocationFilter===l?'active':''}" onclick="setSummaryLocation('${l}')">${l}</div>`;});
  let f=entries;
  if(summaryPeriodFilter!=='All') f=f.filter(e=>e.date.startsWith(summaryPeriodFilter));
  if(summaryWorkerFilter!=='All') f=f.filter(e=>e.worker===summaryWorkerFilter);
  if(summaryLocationFilter!=='All') f=f.filter(e=>e.location===summaryLocationFilter);
  const ot=f.filter(e=>e.type==='OT'),reg=f.filter(e=>e.type==='REG');
  const otH=ot.reduce((a,e)=>a+(parseFloat(e.otHours)||0),0),rH=reg.reduce((a,e)=>a+(parseFloat(e.regHours)||0),0);
  const otD=new Set(ot.map(e=>e.date)).size;
  const wOT={};ot.forEach(e=>{wOT[e.worker]=(wOT[e.worker]||0)+(parseFloat(e.otHours)||0);});
  const mW=Math.max(...Object.values(wOT),1);
  const wBars=Object.entries(wOT).sort((a,b)=>b[1]-a[1]).map(([w,h])=>`<div class="worker-bar-row"><div class="worker-bar-name">${w}</div><div class="worker-bar-track"><div class="worker-bar-fill ot" style="width:${(h/mW)*100}%"></div></div><div class="worker-bar-num">${h}h</div></div>`).join('');

    <div class="summary-grid">

      <div class="summary-big-card"><div class="sbc-label">OT Days</div><div class="sbc-val red">${otD}</div><div class="sbc-sub">Unique dates</div></div>
      <div class="summary-big-card"><div class="sbc-label">Total Entries</div><div class="sbc-val">${f.length}</div><div class="sbc-sub">${new Set(f.map(e=>e.worker)).size} workers</div></div>
    </div>

    ${lTags?`<div class="section-title">OT by Location</div><div class="location-tag-list">${lTags}</div>`:''}`;

function generateReport(){
  const mf=document.getElementById('report-month').value,tf=document.getElementById('report-type').value;
  let f=entries;
  if(mf!=='all') f=f.filter(e=>e.date.startsWith(mf));
  if(tf!=='all') f=f.filter(e=>e.type===tf);
  f=f.sort((a,b)=>a.date.localeCompare(b.date));
  const ot=f.filter(e=>e.type==='OT'),reg=f.filter(e=>e.type==='REG');
  const otH=ot.reduce((a,e)=>a+(parseFloat(e.otHours)||0),0),rH=reg.reduce((a,e)=>a+(parseFloat(e.regHours)||0),0);
  const otDates=[...new Set(ot.map(e=>e.date))].sort();
  const pl=mf==='all'?'All Periods':MONTHS[parseInt(mf.split('-')[1])-1]+' '+mf.split('-')[0];
  const otByDate={};ot.forEach(e=>{(otByDate[e.date]=otByDate[e.date]||[]).push(e);});
  let evHtml='';
  otDates.forEach(date=>{
    const d=new Date(date+'T12:00:00');
    const dl=`${DS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    const ev=otByDate[date];
    const workers=[...new Set(ev.map(e=>e.worker))].join(', ');
    const locs=[...new Set(ev.map(e=>e.location))].join(', ');
    const hrs=ev.reduce((a,e)=>a+(parseFloat(e.otHours)||0),0);
    const reasons=[...new Set(ev.map(e=>e.reason).filter(Boolean))].join('; ');
    const notes=ev.map(e=>e.notes).filter(Boolean).join(' | ');
    evHtml+=`<div class="ot-event"><strong>${dl}</strong><br><strong>Personnel:</strong> ${workers}<br><strong>Location(s):</strong> ${locs}<br><strong>OT Hours:</strong> ${hrs}h<br>${reasons?`<strong>Reason:</strong> ${reasons}<br>`:''}${notes?`<strong>Activity:</strong> ${notes}`:''}</div>`;
  });
  const wSum={};f.forEach(e=>{if(!wSum[e.worker])wSum[e.worker]={reg:0,ot:0};wSum[e.worker].reg+=parseFloat(e.regHours)||0;wSum[e.worker].ot+=parseFloat(e.otHours)||0;});
  const wRows=Object.entries(wSum).sort((a,b)=>b[1].ot-a[1].ot).map(([w,d])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span>${w}</span><span style="font-family:'DM Mono',monospace;color:var(--red)">${d.ot}h OT / ${d.reg}h Reg</span></div>`).join('');
  document.getElementById('report-output').innerHTML=`
    <div class="report-output">
      <h2>OT Justification Report</h2>
      <div class="report-meta">Period: ${pl} &nbsp;|&nbsp; Generated: ${new Date().toLocaleDateString()}<br>San Mateo County — Facilities Management</div>
      <h3>Summary</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0">
        <div style="background:var(--red-light);border-radius:8px;padding:10px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--red);font-family:'DM Mono',monospace">${otH}h</div><div style="font-size:11px;color:var(--slate)">Total OT Hours</div></div>
        <div style="background:var(--green-light);border-radius:8px;padding:10px;text-align:center"><div style="font-size:22px;font-weight:700;color:var(--green);font-family:'DM Mono',monospace">${rH}h</div><div style="font-size:11px;color:var(--slate)">Regular Hours</div></div>
      </div>
      <div style="font-size:13px;margin:8px 0;padding:10px;background:var(--bg);border-radius:8px"><strong>${ot.length}</strong> OT entries across <strong>${otDates.length}</strong> days involving <strong>${new Set(ot.map(e=>e.worker)).size}</strong> personnel at <strong>${new Set(ot.map(e=>e.location)).size}</strong> facilities.</div>
      ${evHtml?`<h3>Overtime Events</h3>${evHtml}`:'<p style="color:var(--slate);font-size:13px">No OT entries.</p>'}
      <h3>Personnel Summary</h3><div>${wRows}</div>
      <h3>Justification Statement</h3>
      <div style="background:var(--bg);padding:12px;border-radius:8px;font-size:13px;line-height:1.6">During the period of ${pl}, Facilities Management personnel logged ${otH} hours of overtime across ${otDates.length} events. Each overtime occurrence was driven by emergency response requirements, mandatory off-hours scheduling constraints at secure or occupied county facilities, or supervisor-authorized directed work. The weekday log confirms a team operating at full operational capacity with no ability to defer critical infrastructure failures, security incidents, or compliance-mandated activities to regular business hours. All overtime was necessary to maintain the health, safety, and operational continuity of San Mateo County facilities and their occupants.</div>
    </div>
    <button class="copy-report-btn" onclick="copyReport()">Copy Report Text</button>`;
}

function generateDayReport(ds){
  const d=new Date(ds+'T12:00:00');
  const dl=`${DS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  const dayOT=entries.filter(e=>e.date===ds&&e.type==='OT');
  if(!dayOT.length){showToast('No OT entries for this day');return;}
  const workers=dayOT.map(e=>e.worker).join(', ');
  const locs=[...new Set(dayOT.map(e=>e.location))].join(', ');
  const hrs=dayOT.reduce((a,e)=>a+(parseFloat(e.otHours)||0),0);
  const reasons=[...new Set(dayOT.map(e=>e.reason).filter(Boolean))].join('; ');
  const notes=dayOT.map(e=>e.notes).filter(Boolean).join(' ');
  alert(`OT JUSTIFICATION — ${dl}\n\nPersonnel: ${workers}\nLocation(s): ${locs}\nOT Hours: ${hrs}h\nReason: ${reasons||'Operational necessity'}\n\nActivity: ${notes}\n\nJustification: The above overtime was required at county facilities and could not be deferred without risk to operations, occupant safety, or compliance obligations.`);
}

  const text=document.querySelector('.report-output')?.innerText||'';
  navigator.clipboard.writeText(text).then(()=>showToast('Report copied!')).catch(()=>showToast('Copy failed'));
}

}

function exportCSV(){

function exportOTSummary(){
  const ot=entries.filter(e=>e.type==='OT').sort((a,b)=>a.date.localeCompare(b.date));
  const DS2=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const byDate={};ot.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  const totalH=ot.reduce((a,e)=>a+(parseFloat(e.otHours)||0),0);
  let t='OT JUSTIFICATION SUMMARY\nSan Mateo County Facilities Management\nGenerated: '+new Date().toLocaleDateString()+'\n'+'='.repeat(52)+'\n\n';
  t+=`TOTALS: ${ot.length} OT entries | ${Object.keys(byDate).length} OT days | ${totalH} total OT hours\n\n`;
  t+='OT EVENTS (Chronological)\n'+'-'.repeat(52)+'\n\n';
  Object.entries(byDate).forEach(([date,evts])=>{
    const d=new Date(date+'T12:00:00');
    const lbl=`${DS2[d.getDay()]}, ${MO[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    const workers=[...new Set(evts.map(e=>e.worker))].join(', ');
    const locs=[...new Set(evts.map(e=>e.location))].join(', ');
    const hrs=evts.reduce((a,e)=>a+(parseFloat(e.otHours)||0),0);
    const reasons=[...new Set(evts.map(e=>e.reason).filter(Boolean))].join('; ');
    const notes=evts.map(e=>e.notes).filter(Boolean).join(' | ');
    t+=`DATE: ${lbl}\nPERSONNEL: ${workers}\nLOCATION(S): ${locs}\nOT HOURS: ${hrs}h\n`;
    if(reasons)t+=`REASON: ${reasons}\n`;
    if(notes)t+=`ACTIVITY: ${notes}\n`;
    t+='\n';
  });
  dlFile('OT_Summary_'+new Date().toISOString().slice(0,10)+'.txt',t,'text/plain');
  showToast('OT Summary downloaded!');
}
function importCSV(input){
  const file=input.files[0];
  if(!file){return;}
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const text=e.target.result;
      const lines=text.split(/[\r\n]+/).filter(l=>l.trim());
      if(lines.length<2){throw new Error('File appears empty');}

      // Parse header row
      const parseRow=row=>{
        const result=[];
        let cur='',inQ=false;
        for(let i=0;i<row.length;i++){
          const ch=row[i];
          if(ch==='"'){
            if(inQ&&row[i+1]==='"'){cur+='"';i++;}
            else inQ=!inQ;
          } else if(ch===','&&!inQ){result.push(cur.trim());cur='';}
          else cur+=ch;
        }
        result.push(cur.trim());
        return result;
      };

      const headers=parseRow(lines[0]).map(h=>h.toLowerCase().replace(/ /g,"").replace(/\t/g,""));
      // Map header names to fields
      const idx={
        id: headers.indexOf("id"),
        date: headers.indexOf("date"),
        type: headers.indexOf("type"),
        worker: headers.indexOf("worker"),
        location: headers.indexOf("location"),
        regHours: Math.max(headers.indexOf("reghours"),headers.indexOf("reg hours"),headers.indexOf("regularhours")),
        otHours: Math.max(headers.indexOf("othours"),headers.indexOf("ot hours"),headers.indexOf("overtimehours")),
        notes: headers.indexOf("notes"),
        reason: headers.indexOf("reason")
      };

      if(idx.date<0||idx.worker<0||idx.location<0){
        throw new Error("Could not find required columns (Date, Worker, Location). Make sure you are importing a CSV exported from this app.");
      }

      const existingIds=new Set(entries.map(en=>en.id));
      const incoming=[];
      for(let i=1;i<lines.length;i++){
        const cols=parseRow(lines[i]);
        if(!cols||cols.length<3)continue;
        const entryId=idx.id>=0?cols[idx.id]:"csv_"+Date.now()+"_"+i;
        const entry={
          id: entryId||"csv_"+i,
          date: (cols[idx.date]||'').replace(/"/g,''),
          type: (cols[idx.type]||'REG').replace(/"/g,'').toUpperCase()==='OT'?'OT':'REG',
          worker: (cols[idx.worker]||'').replace(/"/g,''),
          location: (cols[idx.location]||'').replace(/"/g,''),
          regHours: idx.regHours>=0?parseFloat(cols[idx.regHours])||0:8,
          otHours: idx.otHours>=0?parseFloat(cols[idx.otHours])||0:0,
          notes: idx.notes>=0?(cols[idx.notes]||'').replace(/"/g,''):'',
          reason: idx.reason>=0?(cols[idx.reason]||'').replace(/"/g,''):''
        };
        // Validate date format
        if(!/^\d{4}-\d{2}-\d{2}$/.test(entry.date))continue;
        if(!entry.worker||!entry.location)continue;
        incoming.push(entry);
      }

      if(!incoming.length){throw new Error("No valid rows found. Check that dates are in YYYY-MM-DD format and Worker/Location columns are filled.");}

      const newEntries=incoming.filter(en=>!existingIds.has(en.id));
      const dupes=incoming.length-newEntries.length;
      entries=[...entries,...newEntries];
      save();
      renderCalendar();renderSummary();renderList();populateReportMonths();
      input.value='';
      toggleExportMenu();
      const modal=document.getElementById('import-modal');
      document.getElementById('import-modal-title').textContent='CSV Import Complete';
      document.getElementById('import-modal-msg').innerHTML=
        '<strong>'+newEntries.length+'</strong> new entries imported.<br>'+
        (dupes>0?'<strong>'+dupes+'</strong> duplicate IDs skipped.<br>':'')+
        '<br>Total entries now: <strong>'+entries.length+'</strong>';
      modal.style.display='flex';
    }catch(err){
      input.value='';
      const modal=document.getElementById('import-modal');
      document.getElementById('import-modal-title').textContent='CSV Import Failed';
      document.getElementById('import-modal-msg').textContent=err.message;
      modal.style.display='flex';
    }
  };
  reader.readAsText(file);
}

function dlFile(name,content,mime){
  // Try Blob/ObjectURL first (desktop browsers)
  try{
    const blob=new Blob([content],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=name;
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    return;
  }catch(e){}
  // Fallback: base64 data URI (works on Android Chrome)
  try{
    const b64=btoa(unescape(encodeURIComponent(content)));
    const a=document.createElement('a');
    a.href='data:'+mime+';base64,'+b64;
    a.download=name;
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    return;
  }catch(e){}
  // Last resort: show in modal so user can copy
  document.getElementById('evm-title').textContent=name;
  document.getElementById('evm-content').value=content;
  document.getElementById('export-view-modal').style.display='flex';
}

function copyExportContent(){
  const ta=document.getElementById('evm-content');
  ta.select();
  try{
    navigator.clipboard.writeText(ta.value).then(()=>showToast('Copied!')).catch(()=>{
      document.execCommand('copy');showToast('Copied!');
    });
  }catch(e){document.execCommand('copy');showToast('Copied!');}
}
function toggleExportMenu(){
  const m=document.getElementById('export-menu');
  m.style.display=m.style.display==='flex'?'none':'flex';
}

function importJSON(input){
  const file=input.files[0];
  if(!file){return;}
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      // Accept both raw array or {entries:[...]} format
      const incoming=Array.isArray(data)?data:(data.entries||[]);
      if(!incoming.length){throw new Error('No entries found in file');}
      // Merge: skip any IDs already in entries
      const existingIds=new Set(entries.map(en=>en.id));
      const newEntries=incoming.filter(en=>!existingIds.has(en.id));
      const dupes=incoming.length-newEntries.length;
      entries=[...entries,...newEntries];
      save();
      renderCalendar();
      renderSummary();
      renderList();
      populateReportMonths();
      // Reset file input so same file can be re-imported if needed
      input.value='';
      toggleExportMenu();
      // Show result modal
      const modal=document.getElementById('import-modal');
      document.getElementById('import-modal-title').textContent='Import Complete';
      document.getElementById('import-modal-msg').innerHTML=
        '<strong>'+newEntries.length+'</strong> new entries added.<br>'+
        (dupes>0?'<strong>'+dupes+'</strong> duplicate entries skipped (already in app).<br>':'')+
        '<br>Total entries now: <strong>'+entries.length+'</strong>';
      modal.style.display='flex';
    }catch(err){
      input.value='';
      const modal=document.getElementById('import-modal');
      document.getElementById('import-modal-title').textContent='Import Failed';
      document.getElementById('import-modal-msg').textContent='Could not read file: '+err.message+'. Make sure you are importing a JSON file exported from this app.';
      modal.style.display='flex';
    }
  };
  reader.readAsText(file);
}
</script>
<div class="export-fab">
  <div class="export-menu" id="export-menu">
    <button class="export-menu-item" onclick="exportCSV()">📊 Export CSV</button>
    <button class="export-menu-item" onclick="exportJSON()">💾 Backup JSON</button>
    <button class="export-menu-item" onclick="exportOTSummary()">📋 OT Summary TXT</button>
    <div style="height:1px;background:var(--border);margin:2px 0"></div>
    <button class="export-menu-item" style="color:var(--green)" onclick="document.getElementById('import-json').click()">📥 Import JSON Backup</button>
    <button class="export-menu-item" style="color:var(--green)" onclick="document.getElementById('import-csv').click()">📊 Import Excel CSV</button>
    <input type="file" id="import-json" accept=".json" style="display:none" onchange="importJSON(this)">
    <input type="file" id="import-csv" accept=".csv,.xlsx" style="display:none" onchange="importCSV(this)">
  </div>
  <button class="export-fab-btn" onclick="toggleExportMenu()">⬇ Data</button>
</div>
<!-- IMPORT RESULT MODAL -->
<div id="import-modal" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.5);align-items:center;justify-content:center">

  </div>
</div>

<div id="export-view-modal" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.6);align-items:flex-end">
  <div style="background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:80vh;display:flex;flex-direction:column;padding:0 0 30px">
    <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:16px;font-weight:700" id="evm-title">Export Data</div>
      <button onclick="document.getElementById('export-view-modal').style.display='none'" style="background:var(--border);border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer">✕</button>
    </div>
    <div style="padding:12px 16px;font-size:12px;color:var(--slate);background:var(--bg)">Long-press the text below → Select All → Copy → paste into Notes or Email to save.</div>
    <textarea id="evm-content" style="flex:1;margin:12px 16px;padding:12px;font-family:DM Mono,monospace;font-size:11px;border:1px solid var(--border);border-radius:10px;resize:none;background:var(--bg);color:var(--charcoal)" readonly></textarea>
    <div style="padding:0 16px">
      <button onclick="copyExportContent()" style="width:100%;background:var(--green);color:white;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:DM Sans,sans-serif">Copy to Clipboard</button>
    </div>
  </div>
</div>
